[package]
name = "rchub-official-native"
version = "1.0.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
base64 = "0.22"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", default-features = false, features = ["Win32_System_Wmi", "Win32_System_Com", "Win32_System_Rpc"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Power", "Win32_Devices_Display", "Win32_System_Diagnostics_Debug", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Shutdown", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
