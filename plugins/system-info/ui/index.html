<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>System Info</title>
<style>
  :root{
    --bg:#171719;
    --surface:#1f1f23;
    --surface-raised:#26262c;
    --border:#33333b;
    --border-strong:#42424d;
    --text:#ececef;
    --muted:#a4a4ae;
    --faint:#8a8a95;
    --accent:#4d9dff;
    --accent-soft:rgba(77,157,255,.14);
    --danger:#ff9292;
    --ok:#63d68a;
    --radius:16px;
    font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:var(--bg);
    color-scheme:dark;
    -webkit-text-size-adjust:100%;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0;
    min-height:100vh;
    padding:clamp(16px,4vw,40px);
    background:var(--bg);
  }
  main{
    max-width:820px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:clamp(14px,2.5vw,20px);
  }
  h1,h2,p{margin:0}
  h1{
    font-size:clamp(20px,3.2vw,26px);
    line-height:1.2;
    letter-spacing:-.01em;
    font-weight:700;
  }
  h2{
    font-size:12px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .identity{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }
  .mark{
    width:50px;
    height:50px;
    flex:none;
    display:grid;
    place-items:center;
    border-radius:14px;
    border:1px solid rgba(77,157,255,.32);
    background:var(--accent-soft);
    color:var(--accent);
  }
  .titles{min-width:0}
  .subtitle{
    margin-top:3px;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.45;
    max-width:52ch;
  }
  button{
    font:inherit;
  }
  .refresh{
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:40px;
    padding:0 16px;
    border-radius:10px;
    border:1px solid var(--border-strong);
    background:var(--surface-raised);
    color:var(--text);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
  }
  .refresh:hover:not(:disabled){background:#2e2e35;border-color:#53535f}
  .refresh:active:not(:disabled){transform:scale(.98)}
  .refresh:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .refresh:disabled{cursor:progress;color:var(--muted);opacity:.8}
  .refresh-icon{flex:none}
  .refresh[aria-busy="true"] .refresh-icon{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:clamp(16px,3vw,22px);
  }
  .card-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
  }
  .snapshot{
    font-size:12.5px;
    color:var(--faint);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .memory-body{
    display:flex;
    align-items:center;
    gap:clamp(20px,5vw,40px);
  }
  .memory-body[data-usage="medium"]{--memory-color:#f0b873}
  .memory-body[data-usage="high"]{--memory-color:var(--danger)}
  .gauge-wrap{
    position:relative;
    width:140px;
    height:140px;
    flex:none;
  }
  .gauge{
    display:block;
    width:100%;
    height:100%;
    transform:rotate(-90deg);
  }
  .gauge circle{fill:none;stroke-width:10}
  .gauge .track{stroke:#2f2f37}
  .gauge .value{
    stroke:var(--memory-color,var(--accent));
    stroke-linecap:round;
    transition:stroke-dashoffset .5s ease;
  }
  .gauge-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    text-align:center;
  }
  .percent{
    font-size:30px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
  }
  .percent-label{
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:.04em;
  }
  .figures{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .figure-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
  .figure{display:flex;flex-direction:column;gap:4px;min-width:0}
  .figure-label{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.03em;
  }
  .figure-value{
    font-size:19px;
    font-weight:650;
    line-height:1.15;
    font-variant-numeric:tabular-nums;
    overflow-wrap:anywhere;
  }
  .figure-value.is-unavailable,
  .row-value.is-unavailable{
    color:var(--faint);
    font-weight:500;
  }
  .bar{
    height:10px;
    border-radius:999px;
    background:#303038;
    border:1px solid #3a3a44;
    overflow:hidden;
  }
  .bar-used{
    display:block;
    height:100%;
    width:0;
    border-radius:999px;
    background:var(--memory-color,var(--accent));
    transition:width .5s ease;
  }
  .bar-caption{
    font-size:12.5px;
    color:var(--faint);
    font-variant-numeric:tabular-nums;
  }
  .usage-level{font-size:12.5px;color:var(--text)}
  .rows{
    list-style:none;
    margin:0;
    padding:0;
  }
  .row{
    display:grid;
    grid-template-columns:36px minmax(104px,auto) minmax(0,1fr);
    align-items:center;
    gap:12px;
    padding:13px 0;
    border-top:1px solid var(--border);
  }
  .row:first-child{border-top:0;padding-top:2px}
  .row-icon{
    width:34px;
    height:34px;
    border-radius:9px;
    display:grid;
    place-items:center;
  }
  .icon-os{color:#7db8ff;background:rgba(77,157,255,.13)}
  .icon-arch{color:#6fd3c4;background:rgba(79,199,181,.12)}
  .icon-cpu{color:#f0b873;background:rgba(240,176,103,.12)}
  .icon-cores{color:#b9a2ff;background:rgba(157,125,255,.13)}
  .row-label{
    color:var(--muted);
    font-size:13.5px;
    line-height:1.35;
  }
  .row-value{
    min-width:0;
    text-align:right;
    font-size:14.5px;
    font-weight:600;
    line-height:1.4;
    overflow-wrap:anywhere;
  }
  .footer{
    display:flex;
    align-items:flex-start;
    gap:8px;
    min-height:22px;
    padding:0 4px;
  }
  .dot{
    width:8px;
    height:8px;
    margin-top:6px;
    border-radius:50%;
    flex:none;
    background:var(--ok);
  }
  .status{
    font-size:13.5px;
    line-height:1.45;
    color:var(--muted);
    overflow-wrap:anywhere;
  }
  .footer[data-state="loading"] .dot{background:var(--accent)}
  .footer[data-state="error"] .dot{background:var(--danger)}
  .footer[data-state="error"] .status{color:var(--danger)}
  .sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  @media (max-width:560px){
    .memory-body{flex-direction:column;align-items:stretch;gap:20px}
    .gauge-wrap{align-self:center}
    .row{grid-template-columns:34px minmax(0,1fr);row-gap:2px;align-items:start}
    .row-icon{grid-row:1 / span 2;margin-top:1px}
    .row-label{grid-column:2;font-size:12.5px}
    .row-value{grid-column:2;text-align:left;font-size:14px}
    .topbar{align-items:flex-start}
    .refresh{margin-left:64px}
  }
  @media (max-width:360px){
    .refresh{margin-left:0}
    .mark{width:44px;height:44px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>
<main id="content">
  <header class="topbar">
    <div class="identity">
      <span class="mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="6" width="12" height="12" rx="2"></rect>
          <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"></path>
          <rect x="9.5" y="9.5" width="5" height="5" rx="1"></rect>
        </svg>
      </span>
      <div class="titles">
        <h1 id="title">System Info</h1>
        <p class="subtitle" id="subtitle">A manual snapshot of this computer’s hardware and operating system.</p>
      </div>
    </div>
    <button class="refresh" id="refresh" type="button" aria-busy="false">
      <svg class="refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 5.7"></path>
        <path d="M20 4v7h-7"></path>
      </svg>
      <span id="refresh-label">Refresh</span>
    </button>
  </header>

  <section class="card" id="memory-card" aria-labelledby="memory-title">
    <div class="card-head">
      <h2 id="memory-title">Memory</h2>
      <span class="snapshot" id="snapshot" hidden></span>
    </div>
    <div class="memory-body" id="memory-body">
      <div class="gauge-wrap">
        <svg class="gauge" viewBox="0 0 120 120" role="img" aria-labelledby="gauge-title">
          <title id="gauge-title">Memory usage unavailable.</title>
          <circle class="track" cx="60" cy="60" r="52"></circle>
          <circle class="value" id="gauge-value" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="gauge-center" aria-hidden="true">
          <span class="percent" id="memory-percent">—</span>
          <span class="percent-label" id="percent-label">used</span>
        </div>
      </div>
      <div class="figures">
        <div class="figure-grid">
          <div class="figure">
            <span class="figure-label" id="used-label">Used</span>
            <span class="figure-value" id="used-value">—</span>
          </div>
          <div class="figure">
            <span class="figure-label" id="available-label">Available</span>
            <span class="figure-value" id="available-value">—</span>
          </div>
        </div>
        <div class="bar" id="memory-bar" role="img" aria-label="Memory usage unavailable.">
          <span class="bar-used" id="bar-used"></span>
        </div>
        <p class="bar-caption" id="total-caption">—</p>
        <p class="usage-level" id="usage-level" hidden></p>
      </div>
    </div>
  </section>

  <section class="card" id="details-card" aria-labelledby="details-title">
    <div class="card-head">
      <h2 id="details-title">Details</h2>
    </div>
    <ul class="rows">
      <li class="row">
        <span class="row-icon icon-os" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="12" rx="2"></rect>
            <path d="M8 20h8M12 16v4"></path>
          </svg>
        </span>
        <span class="row-label" id="os-label">Operating system</span>
        <span class="row-value" id="os-value">—</span>
      </li>
      <li class="row">
        <span class="row-icon icon-arch" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3 9 5-9 5-9-5 9-5Z"></path>
            <path d="m3 13 9 5 9-5"></path>
          </svg>
        </span>
        <span class="row-label" id="arch-label">Architecture</span>
        <span class="row-value" id="arch-value">—</span>
      </li>
      <li class="row">
        <span class="row-icon icon-cpu" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="5" width="14" height="14" rx="2"></rect>
            <rect x="9" y="9" width="6" height="6" rx="1"></rect>
            <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"></path>
          </svg>
        </span>
        <span class="row-label" id="cpu-label">Processor</span>
        <span class="row-value" id="cpu-value">—</span>
      </li>
      <li class="row">
        <span class="row-icon icon-cores" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
        </span>
        <span class="row-label" id="cores-label">Logical cores</span>
        <span class="row-value" id="cores-value">—</span>
      </li>
    </ul>
  </section>

  <footer class="footer" id="footer" data-state="loading">
    <span class="dot" aria-hidden="true"></span>
    <p class="status" id="status" role="status" aria-live="polite">Loading system information…</p>
  </footer>
</main>
<script>
(() => {
  'use strict';

  const COPY = {
    en: {
      title: 'System Info',
      subtitle: 'A manual snapshot of this computer’s hardware and operating system.',
      refresh: 'Refresh',
      memory: 'Memory',
      used: 'Used',
      available: 'Available',
      total: '{value} total',
      percentLabel: 'used',
      gaugeLabel: 'Memory used: {percent}. {used} used, {available} available. {level}',
      gaugeUnavailable: 'Memory usage unavailable.',
      barLabel: 'Memory use: {percent} used. {used} used, {available} available. {level}',
      usageLow: 'Low memory usage',
      usageMedium: 'Moderate memory usage',
      usageHigh: 'High memory usage',
      details: 'Details',
      os: 'Operating system',
      architecture: 'Architecture',
      processor: 'Processor',
      cores: 'Logical cores',
      unavailable: 'Unavailable',
      loading: 'Loading system information…',
      updated: 'Snapshot captured at {time}.',
      snapshot: 'Captured {time}',
      loadError: 'Could not load system information: {error}',
      refreshError: 'Refresh failed: {error} Showing the snapshot from {time}.',
      bridge: 'Plugin bridge is unavailable.',
      invalidResponse: 'The plugin returned an unexpected response.'
    },
    tr: {
      title: 'Sistem Bilgisi',
      subtitle: 'Bu bilgisayarın donanım ve işletim sistemi bilgilerinin anlık görüntüsü; yenileyene kadar değişmez.',
      refresh: 'Yenile',
      memory: 'Bellek',
      used: 'Kullanılan',
      available: 'Kullanılabilir',
      total: 'Toplam {value}',
      percentLabel: 'kullanılan',
      gaugeLabel: 'Bellek kullanımı: {percent}. {used} kullanılıyor, {available} kullanılabilir. {level}',
      gaugeUnavailable: 'Bellek kullanımı kullanılamıyor.',
      barLabel: 'Bellek kullanımı: {percent}. {used} kullanılıyor, {available} kullanılabilir. {level}',
      usageLow: 'Düşük bellek kullanımı',
      usageMedium: 'Orta düzeyde bellek kullanımı',
      usageHigh: 'Yüksek bellek kullanımı',
      details: 'Ayrıntılar',
      os: 'İşletim sistemi',
      architecture: 'Mimari',
      processor: 'İşlemci',
      cores: 'Mantıksal çekirdek',
      unavailable: 'Kullanılamıyor',
      loading: 'Sistem bilgisi yükleniyor…',
      updated: 'Anlık görüntü {time} itibarıyla alındı.',
      snapshot: 'Alındı: {time}',
      loadError: 'Sistem bilgisi yüklenemedi: {error}',
      refreshError: 'Yenileme başarısız: {error} Son anlık görüntü gösteriliyor ({time}).',
      bridge: 'Eklenti köprüsü kullanılamıyor.',
      invalidResponse: 'Eklenti beklenmeyen bir yanıt döndürdü.'
    }
  };

  const rawLocale = window.RCHub && typeof window.RCHub.locale === 'string' ? window.RCHub.locale.toLowerCase() : '';
  const locale = rawLocale === 'tr' ? 'tr' : 'en';
  const t = COPY[locale];
  const localeTag = locale === 'tr' ? 'tr-TR' : 'en-US';

  const numberFormat = new Intl.NumberFormat(localeTag, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const integerFormat = new Intl.NumberFormat(localeTag, { maximumFractionDigits: 0 });
  const percentFormat = new Intl.NumberFormat(localeTag, { style: 'percent', maximumFractionDigits: 0 });
  const timeFormat = new Intl.DateTimeFormat(localeTag, { hour: '2-digit', minute: '2-digit' });

  const byId = id => document.getElementById(id);
  const refreshButton = byId('refresh');
  const refreshLabel = byId('refresh-label');
  const footer = byId('footer');
  const status = byId('status');
  const snapshot = byId('snapshot');
  const memoryCard = byId('memory-card');
  const detailsCard = byId('details-card');
  const gauge = byId('gauge-value');
  const gaugeTitle = byId('gauge-title');
  const gaugeCircumference = 2 * Math.PI * 52;

  byId('title').textContent = t.title;
  byId('subtitle').textContent = t.subtitle;
  refreshLabel.textContent = t.refresh;
  byId('memory-title').textContent = t.memory;
  byId('used-label').textContent = t.used;
  byId('available-label').textContent = t.available;
  byId('percent-label').textContent = t.percentLabel;
  byId('details-title').textContent = t.details;
  byId('os-label').textContent = t.os;
  byId('arch-label').textContent = t.architecture;
  byId('cpu-label').textContent = t.processor;
  byId('cores-label').textContent = t.cores;
  gaugeTitle.textContent = t.gaugeUnavailable;
  byId('memory-bar').setAttribute('aria-label', t.gaugeUnavailable);
  document.title = t.title;
  document.documentElement.lang = locale;
  status.textContent = t.loading;

  gauge.style.strokeDasharray = String(gaugeCircumference);
  gauge.style.strokeDashoffset = String(gaugeCircumference);

  let lastCapturedAt = null;

  const fill = (template, values) => template.replace(/\{(\w+)\}/g, (match, key) => key in values ? values[key] : match);

  const cleanString = value => typeof value === 'string' && value.trim() ? value.trim() : null;

  const readableError = error => {
    if (error && typeof error.message === 'string' && error.message) return error.message;
    if (typeof error === 'string' && error) return error;
    return String(error);
  };

  const setValue = (id, text) => {
    const element = byId(id);
    const available = text !== null && text !== undefined;
    element.textContent = available ? text : t.unavailable;
    element.classList.toggle('is-unavailable', !available);
  };

  const formatBytes = bytes => {
    if (!Number.isFinite(bytes) || bytes < 0) return null;
    return numberFormat.format(bytes / 1073741824) + ' GiB';
  };

  const setState = (state, message) => {
    footer.dataset.state = state;
    status.textContent = message;
  };

  const renderUnavailable = () => {
    setValue('used-value', null);
    setValue('available-value', null);
    setValue('os-value', null);
    setValue('arch-value', null);
    setValue('cpu-value', null);
    setValue('cores-value', null);
    byId('memory-percent').textContent = '—';
    delete byId('memory-body').dataset.usage;
    byId('usage-level').hidden = true;
    gauge.style.strokeDashoffset = String(gaugeCircumference);
    gaugeTitle.textContent = t.gaugeUnavailable;
    byId('memory-bar').setAttribute('aria-label', t.gaugeUnavailable);
    byId('memory-bar').hidden = true;
    byId('bar-used').style.width = '0%';
    byId('total-caption').textContent = t.unavailable;
    byId('total-caption').classList.add('is-unavailable');
    snapshot.hidden = true;
  };

  const render = result => {
    if (!result || typeof result !== 'object') throw new Error(t.invalidResponse);
    const os = result.os && typeof result.os === 'object' ? result.os : {};
    const cpu = result.cpu && typeof result.cpu === 'object' ? result.cpu : {};
    const memory = result.memory && typeof result.memory === 'object' ? result.memory : {};

    const osName = cleanString(os.name);
    const osVersion = cleanString(os.version);
    let osText = null;
    if (osName && osVersion) {
      osText = osVersion.toLowerCase().startsWith(osName.toLowerCase()) ? osVersion : osName + ' ' + osVersion;
    } else {
      osText = osName || osVersion;
    }
    setValue('os-value', osText);
    setValue('arch-value', cleanString(os.architecture));

    setValue('cpu-value', cleanString(cpu.brand));
    const logicalCores = Number.isInteger(cpu.logical_cores) && cpu.logical_cores > 0 ? integerFormat.format(cpu.logical_cores) : null;
    setValue('cores-value', logicalCores);

    const total = Number.isFinite(memory.total_bytes) ? memory.total_bytes : 0;
    const available = Number.isFinite(memory.available_bytes) ? memory.available_bytes : 0;
    const memoryUsable = total > 0 && available > 0 && available <= total;
    const used = memoryUsable ? total - available : null;
    const ratio = memoryUsable ? used / total : null;
    const usedText = used === null ? null : formatBytes(used);
    const availableText = memoryUsable ? formatBytes(available) : null;
    const totalText = total > 0 ? formatBytes(total) : null;

    setValue('used-value', usedText);
    setValue('available-value', availableText);
    byId('total-caption').textContent = totalText ? fill(t.total, { value: totalText }) : t.unavailable;
    byId('total-caption').classList.toggle('is-unavailable', !totalText);

    const percentText = ratio === null ? '—' : percentFormat.format(ratio);
    byId('memory-percent').textContent = percentText;

    if (ratio === null) {
      delete byId('memory-body').dataset.usage;
      byId('usage-level').hidden = true;
      gauge.style.strokeDashoffset = String(gaugeCircumference);
      gaugeTitle.textContent = t.gaugeUnavailable;
      byId('memory-bar').setAttribute('aria-label', t.gaugeUnavailable);
      byId('memory-bar').hidden = true;
      byId('bar-used').style.width = '0%';
    } else {
      gauge.style.strokeDashoffset = String(gaugeCircumference * (1 - ratio));
      // Use the displayed whole percentage so the label and color agree at thresholds.
      const percent = Math.round(ratio * 100);
      const usage = percent >= 90 ? 'high' : percent >= 70 ? 'medium' : 'low';
      const level = t[usage === 'high' ? 'usageHigh' : usage === 'medium' ? 'usageMedium' : 'usageLow'];
      byId('memory-body').dataset.usage = usage;
      byId('usage-level').textContent = level;
      byId('usage-level').hidden = false;
      const gaugeText = fill(t.gaugeLabel, { percent: percentText, used: usedText, available: availableText, level });
      const barText = fill(t.barLabel, { percent: percentText, used: usedText, available: availableText, level });
      gaugeTitle.textContent = gaugeText;
      byId('memory-bar').setAttribute('aria-label', barText);
      byId('memory-bar').hidden = false;
      byId('bar-used').style.width = (ratio * 100).toFixed(2) + '%';
    }

    lastCapturedAt = new Date();
    const capturedText = timeFormat.format(lastCapturedAt);
    snapshot.textContent = fill(t.snapshot, { time: capturedText });
    snapshot.hidden = false;
    setState('ok', fill(t.updated, { time: capturedText }));
  };

  let loading = false;

  const refresh = async () => {
    if (loading) return;
    loading = true;
    refreshButton.disabled = true;
    refreshButton.setAttribute('aria-busy', 'true');
    memoryCard.setAttribute('aria-busy', 'true');
    detailsCard.setAttribute('aria-busy', 'true');
    setState('loading', t.loading);
    try {
      if (!window.RCHub || typeof window.RCHub.request !== 'function') throw new Error(t.bridge);
      const result = await window.RCHub.request('system.info', {});
      render(result);
    } catch (error) {
      const message = readableError(error);
      if (lastCapturedAt) {
        const capturedText = timeFormat.format(lastCapturedAt);
        setState('error', fill(t.refreshError, { error: message, time: capturedText }));
      } else {
        renderUnavailable();
        setState('error', fill(t.loadError, { error: message }));
      }
    } finally {
      loading = false;
      refreshButton.disabled = false;
      refreshButton.setAttribute('aria-busy', 'false');
      memoryCard.setAttribute('aria-busy', 'false');
      detailsCard.setAttribute('aria-busy', 'false');
    }
  };

  refreshButton.addEventListener('click', refresh);
  refresh();
})();
</script>
</body>
</html>
